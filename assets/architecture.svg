<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="460">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="header-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94A3B8; }
      .card-pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #38BDF8; }
      .arrow { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
      .flow-label { font-family: -apple-system, sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="460" rx="14" fill="#0A0E1A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Architecture Title Header -->
  <g transform="translate(30, 36)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">UrduEval End-to-End Evaluation Pipeline</text>
    <text x="0" y="20" font-family="ui-monospace, monospace" font-size="12" fill="#64748B">Modular, extensible, local-first evaluation architecture</text>
  </g>

  <!-- Row 1: Target Models (Top Left) -->
  <g transform="translate(30, 80)" filter="url(#box-shadow)">
    <rect width="260" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="260" height="4" rx="2" fill="#06B6D4"/>
    <text x="18" y="28" class="card-title">1. Model Providers</text>
    <text x="18" y="46" class="card-sub">Local &amp; Cloud Inference</text>

    <g transform="translate(18, 62)">
      <rect width="105" height="24" rx="4" fill="#0B1329" stroke="#1E293B"/>
      <text x="52" y="16" text-anchor="middle" class="card-pill">Ollama (Local)</text>
      
      <rect width="105" height="24" rx="4" x="115" fill="#0B1329" stroke="#1E293B"/>
      <text x="167" y="16" text-anchor="middle" class="card-pill">HuggingFace</text>
      
      <rect width="105" height="24" rx="4" y="32" fill="#0B1329" stroke="#1E293B"/>
      <text x="52" y="48" text-anchor="middle" class="card-pill">OpenAI / Claude</text>
      
      <rect width="105" height="24" rx="4" x="115" y="32" fill="#0B1329" stroke="#1E293B"/>
      <text x="167" y="48" text-anchor="middle" class="card-pill">OpenRouter / HTTP</text>
    </g>
  </g>

  <!-- Row 1: Benchmark Registry (Top Right) -->
  <g transform="translate(340, 80)" filter="url(#box-shadow)">
    <rect width="270" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="270" height="4" rx="2" fill="#10B981"/>
    <text x="18" y="28" class="card-title">2. Benchmark Registry</text>
    <text x="18" y="46" class="card-sub">Standard &amp; Custom Datasets</text>

    <g transform="translate(18, 62)">
      <rect width="110" height="24" rx="4" fill="#0B1329" stroke="#1E293B"/>
      <text x="55" y="16" text-anchor="middle" class="card-pill" fill="#10B981">urdu-qa / reasoning</text>
      
      <rect width="110" height="24" rx="4" x="120" fill="#0B1329" stroke="#1E293B"/>
      <text x="175" y="16" text-anchor="middle" class="card-pill" fill="#10B981">urdu-translation</text>
      
      <rect width="110" height="24" rx="4" y="32" fill="#0B1329" stroke="#1E293B"/>
      <text x="55" y="48" text-anchor="middle" class="card-pill" fill="#10B981">urdu-roman / summary</text>
      
      <rect width="110" height="24" rx="4" x="120" y="32" fill="#0B1329" stroke="#1E293B"/>
      <text x="175" y="48" text-anchor="middle" class="card-pill" fill="#10B981">Custom *.jsonl</text>
    </g>
  </g>

  <!-- Row 1: Execution Runner & Cache (Far Right) -->
  <g transform="translate(660, 80)" filter="url(#box-shadow)">
    <rect width="270" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="270" height="4" rx="2" fill="#6366F1"/>
    <text x="18" y="28" class="card-title">3. Runner &amp; Resilience</text>
    <text x="18" y="46" class="card-sub">Parallel &amp; Fault-Tolerant</text>

    <g transform="translate(18, 62)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• ThreadPool / Async Concurrency</text>
      <text x="0" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• SQLite Response Cache (Zero waste)</text>
      <text x="0" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Resumable JSONL Checkpointing</text>
    </g>
  </g>

  <!-- Connecting arrows from top row down -->
  <path d="M 160 230 L 160 265 L 480 265" class="arrow" stroke="#38BDF8"/>
  <path d="M 480 230 L 480 265" class="arrow" stroke="#10B981"/>
  <path d="M 795 230 L 795 265 L 480 265" class="arrow" stroke="#6366F1"/>
  <circle cx="480" cy="265" r="4" fill="#38BDF8"/>

  <!-- Row 2: Urdu Normalization Layer (Center Core) -->
  <g transform="translate(30, 280)" filter="url(#box-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="4" rx="2" fill="#EC4899"/>
    <text x="18" y="28" class="card-title">4. Normalization Engine</text>
    <text x="18" y="46" class="card-sub">Conservative &amp; Script-Aware</text>

    <g transform="translate(18, 64)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Yeh / Kaf / Heh Harmonization</text>
      <text x="0" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Aerab / Diacritics Stripping</text>
      <text x="0" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Roman Urdu Phonetic Variant Map</text>
    </g>
  </g>

  <!-- Row 2: Metrics Engine -->
  <g transform="translate(340, 280)" filter="url(#box-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="4" rx="2" fill="#F59E0B"/>
    <text x="18" y="28" class="card-title">5. Multi-Metric Evaluation</text>
    <text x="18" y="46" class="card-sub">N-gram, Character &amp; LLM-Judge</text>

    <g transform="translate(18, 64)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Exact Match &amp; Token F1</text>
      <text x="0" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• BLEU-4, chrF, chrF++, ROUGE-L</text>
      <text x="0" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Structured LLM-as-a-Judge</text>
    </g>
  </g>

  <!-- Row 2: Analysis & Export -->
  <g transform="translate(650, 280)" filter="url(#box-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="4" rx="2" fill="#10B981"/>
    <text x="18" y="28" class="card-title">6. Analysis &amp; Reports</text>
    <text x="18" y="46" class="card-sub">Diagnostics &amp; Presentation</text>

    <g transform="translate(18, 64)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Failure Taxonomy Classification</text>
      <text x="0" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Terminal Rich Cards &amp; Tables</text>
      <text x="0" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">• Self-Contained Interactive HTML</text>
    </g>
  </g>
</svg>
