<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="40%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="mesh1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mesh2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 58px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .urdu-title { font-family: "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", "Urdu Typesetting", "Arabic Typesetting", serif; font-size: 54px; fill: #34D399; font-weight: bold; direction: rtl; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 22px; fill: #94A3B8; font-weight: 400; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #E2E8F0; }
      .stat-number { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #38BDF8; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; text-transform: uppercase; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#mesh1)"/>
  <rect width="1200" height="360" rx="16" fill="url(#mesh2)"/>

  <!-- Border Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Decorative Tech Pattern -->
  <g opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4 6">
    <line x1="60" y1="50" x2="1140" y2="50"/>
    <line x1="60" y1="310" x2="1140" y2="310"/>
  </g>

  <!-- Brand Mark Icon Box -->
  <g transform="translate(60, 68)" filter="url(#drop-shadow)">
    <rect width="76" height="76" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect width="76" height="76" rx="18" fill="url(#badge-glow)"/>
    <path d="M24 24 L52 24 L52 30 L40 44 L52 44 L52 52 L24 52 L24 46 L36 32 L24 32 Z" fill="#10B981" opacity="0.1"/>
    <!-- Stylized Urdu Alef & Ayn monogram -->
    <text x="38" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="url(#primary-glow)">UE</text>
  </g>

  <!-- Titles -->
  <g transform="translate(156, 108)">
    <text x="0" y="0" class="title">UrduEval</text>
    <text x="270" y="-4" class="urdu-title">اردو ایویل</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(156, 146)">
    <text x="0" y="0" class="tagline">The open, rigorous evaluation layer for Urdu &amp; Roman Urdu AI.</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(156, 185)">
    <!-- Badge 1: Urdu Script & Roman Urdu -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#10B981"/>
      <text x="28" y="21" class="badge-text">Urdu Script + Roman Urdu</text>
    </g>

    <!-- Badge 2: Multi-Model Concurrency -->
    <g transform="translate(222, 0)">
      <rect width="200" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#06B6D4"/>
      <text x="28" y="21" class="badge-text">Local Ollama &amp; Cloud APIs</text>
    </g>

    <!-- Badge 3: Custom JSONL Support -->
    <g transform="translate(434, 0)">
      <rect width="190" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#6366F1"/>
      <text x="28" y="21" class="badge-text">Custom JSONL Datasets</text>
    </g>

    <!-- Badge 4: Standalone HTML Reports -->
    <g transform="translate(636, 0)">
      <rect width="185" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#F59E0B"/>
      <text x="28" y="21" class="badge-text">Interactive HTML Reports</text>
    </g>
  </g>

  <!-- Bottom Metric Highlights Box -->
  <g transform="translate(156, 252)">
    <rect width="880" height="60" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(30, 24)">
      <text x="0" y="10" class="stat-number">6+</text>
      <text x="45" y="10" class="stat-label">Core Tasks</text>
    </g>
    
    <line x1="160" y1="12" x2="160" y2="48" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(190, 24)">
      <text x="0" y="10" class="stat-number">7+</text>
      <text x="45" y="10" class="stat-label">Metrics (F1, chrF++, Judge)</text>
    </g>

    <line x1="420" y1="12" x2="420" y2="48" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(450, 24)">
      <text x="0" y="10" class="stat-number">0</text>
      <text x="30" y="10" class="stat-label">Fabricated Benchmarks</text>
    </g>

    <line x1="660" y1="12" x2="660" y2="48" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(690, 24)">
      <text x="0" y="10" class="stat-number">100%</text>
      <text x="65" y="10" class="stat-label">Local &amp; Private</text>
    </g>
  </g>
</svg>
